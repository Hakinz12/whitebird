[package]
name = "token_guard"
version = "0.1.0"
description = "WHITEBIRD transfer hook"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed", "interface-instructions"] }
anchor-spl = { version = "=0.30.1", features = ["token_2022", "token_2022_extensions"] }
spl-transfer-hook-interface = "=0.6.3"
spl-token-2022 = { version = "=3.0.2", features = ["no-entrypoint"] }
spl-token = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "=0.6.3"
